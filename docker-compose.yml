version: '3.8'

services:
  finance-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-family-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/finance.db
      - NEXT_PUBLIC_APP_NAME=Keuangan Kita
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
